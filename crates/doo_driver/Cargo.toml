[package]
name = "doo_driver"
version.workspace = true
edition.workspace = true
description = "Compiler driver — CLI, pipeline orchestration, incremental compilation"
license = "MIT"

[dependencies]
doo_core = { path = "../doo_core" }
doo_frontend = { path = "../doo_frontend" }
doo_hir = { path = "../doo_hir" }
doo_thir = { path = "../doo_thir" }
doo_analysis = { path = "../doo_analysis" }
doo_mir = { path = "../doo_mir" }
doo_codegen = { path = "../doo_codegen" }
doo_diagnostics = { path = "../doo_diagnostics" }
inkwell = { version = "0.9.0", features = ["llvm22-1"] }
clap = { version = "4.5", features = ["derive"] }
rustc-hash = "1.1"
blake3 = "1.5"
ctrlc = "3.4"

# Serialization for migration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
