[package]
name = "doo_driver"
version = "0.1.0"
edition = "2021"
description = "Doo compiler driver and CLI"
license = "MIT"

[dependencies]
doo_core = { path = "../doo_core" }
doo_frontend = { path = "../doo_frontend" }
doo_hir = { path = "../doo_hir" }
doo_analysis = { path = "../doo_analysis" }
doo_mir = { path = "../doo_mir" }
doo_codegen = { path = "../doo_codegen" }
doo_diagnostics = { path = "../doo_diagnostics" }

# LLVM bindings (must match doo_codegen)
inkwell = { version = "0.8.0", features = ["llvm18-1"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.12"
console = "0.16"
ctrlc = "3.4"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Paths and system
dirs = "5.0"

# Serialization for migration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP for analytics
ureq = { version = "3.1", features = ["json"] }

[dev-dependencies]
tempfile = "3.8"
