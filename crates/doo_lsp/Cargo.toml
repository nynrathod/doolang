[package]
name = "doo_lsp"
version.workspace = true
edition.workspace = true
description = "Language Server Protocol implementation for Doo"
license = "MIT"

[[bin]]
name = "doo-lsp"
path = "src/main.rs"

[dependencies]
# Core compiler crates — for actual parsing, analysis, type checking
doo_core = { path = "../doo_core" }
doo_frontend = { path = "../doo_frontend" }
doo_hir = { path = "../doo_hir" }
doo_analysis = { path = "../doo_analysis" }

# LSP protocol implementation (same crate rust-analyzer uses)
lsp-server = "0.7"
lsp-types = "0.97"

# Serialization for LSP messages
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"

# Efficient hash maps
rustc-hash = "1.1"
