[package]
name = "doo_core"
version.workspace = true
edition.workspace = true
description = "Core types, traits, and utilities for the Doo compiler"
license = "MIT"

[dependencies]
# Serialization for metadata
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
# Efficient string interning
string-interner = "0.15"

# Arena allocation for AST/HIR/MIR nodes
bumpalo = { version = "3.20.0", features = ["collections"] }

# Structured logging / tracing
tracing = "0.1"

# For hash maps with better performance
rustc-hash = "2.1.3"

[dev-dependencies]
pretty_assertions = "1.4"

[features]
default = []
# Enable extra debug information
debug = []
