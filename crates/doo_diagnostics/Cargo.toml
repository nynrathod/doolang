[package]
name = "doo_diagnostics"
version = "0.1.0"
edition = "2021"
description = "Error diagnostics and formatting for the Doo compiler"
license = "MIT"

[dependencies]
doo_core = { path = "../doo_core" }

# Terminal output
termcolor = "1.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
pretty_assertions = "1.4"
