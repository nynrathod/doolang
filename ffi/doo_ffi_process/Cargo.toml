[package]
name = "doo_ffi_process"
version = "0.1.0"
edition = "2021"
description = "Process management FFI for Doo — run commands, spawn processes, stream stdout/stderr"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
doo_ffi_core = { path = "../doo_ffi_core" }
doo_ffi_runtime = { path = "../doo_ffi_runtime" }
serde_json = "1.0"
libc = "0.2"
dashmap = "6.1.0"
uuid = { version = "1.20.0", features = ["v4"] }
