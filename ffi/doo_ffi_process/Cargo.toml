[package]
name = "doo_ffi_process"
version.workspace = true
edition.workspace = true
description = "Process management FFI for Doo — run commands, spawn processes, stream stdout/stderr"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
doo_ffi_core = { path = "../../library/ffi/doo_ffi_core" }
doo_ffi_runtime = { path = "../../library/ffi/doo_ffi_runtime" }
serde_json = "1.0"
libc = "0.2"
dashmap = "6.1.0"
uuid = { version = "1.20.0", features = ["v4"] }
