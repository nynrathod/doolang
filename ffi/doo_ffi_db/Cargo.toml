[package]
name = "doo_ffi_db"
version.workspace = true
edition.workspace = true
description = "Database FFI layer with pluggable driver architecture"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["postgres"]
postgres = [
	"dep:tokio-postgres",
	"dep:deadpool-postgres",
	"dep:deadpool",
	"dep:chrono",
	"dep:num_cpus",
	"dep:tokio-postgres-rustls",
	"dep:rustls",
	"dep:webpki-roots",
]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
doo_ffi_core = { path = "../../library/ffi/doo_ffi_core" }
doo_ffi_runtime = { path = "../../library/ffi/doo_ffi_runtime" }

# PostgreSQL driver (feature-gated: only compiled when "postgres" feature is active)
tokio-postgres = { version = "0.7", features = [
	"with-chrono-0_4",
	"with-serde_json-1",
], optional = true }
deadpool-postgres = { version = "0.14.1", features = [
	"rt_tokio_1",
], optional = true }
deadpool = { version = "0.12.3", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
num_cpus = { version = "1.17.0", optional = true }

# TLS support for PostgreSQL (Cloud SQL requires encrypted connections)
tokio-postgres-rustls = { version = "0.13", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = [
	"ring",
	"logging",
	"std",
	"tls12",
] }
webpki-roots = { version = "0.26", optional = true }

# High-performance number formatting (zero-alloc)
itoa = "1"
ryu = "1"

# Needed for ToSql trait impl (BytesMut) — already in tree via tokio-postgres
bytes = "1"
