[package]
name = "doo_ffi_core"
version = "0.1.0"
edition = "2021"
description = "Core FFI types shared across all Doo FFI libraries"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Serialization (needed by rfc7807.rs, validation.rs)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# C interop
libc = "0.2"

[dev-dependencies]
pretty_assertions = "1.4"
