[package]
name = "doo_ffi_auth"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["jwt", "oauth"]
jwt = []
oauth = ["dep:minreq", "dep:sha2", "dep:base64", "dep:rand"]

[dependencies]
# Core — always available
bcrypt = "0.18"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
doo_ffi_core = { path = "../doo_ffi_core" }

# libc is used for dlsym on Unix to resolve HTTP FFI symbols at runtime

# OAuth dependencies — behind "oauth" feature gate
minreq = { version = "2", features = ["https-rustls"], optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
rand = { version = "0.8", optional = true }
