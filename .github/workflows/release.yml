name: Build & Publish GHCR Image (Manual)

# This workflow is for manually rebuilding a specific GHCR image tag.
# Automatic builds are handled by dev-release.yml and stable-release.yml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to push (dev, latest, or a version tag)'
        required: true
        default: 'dev'
      doo_version:
        description: 'Doo release tag to install inside the image. Leave empty to use the tag above.'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/doo-runtime

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag }}"
          DOO_VER="${{ github.event.inputs.doo_version }}"
          if [ -z "$DOO_VER" ]; then DOO_VER="$TAG"; fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "doo_version=${DOO_VER}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            DOO_VERSION=${{ steps.version.outputs.doo_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
