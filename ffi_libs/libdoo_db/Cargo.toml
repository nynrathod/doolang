[package]
name = "libdoo_db"
version.workspace = true
edition.workspace = true

[lib]
name = "doo_db"
crate-type = ["cdylib"]

[dependencies]
tokio = { version = "1.48", features = ["full"] }
tokio-postgres = "0.7"
once_cell = "1.21"
serde_json = "1.0"
dotenvy = "0.15"
libdoo_runtime = { path = "../libdoo_runtime" }
libc = "0.2"
