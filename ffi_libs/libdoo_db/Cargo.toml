[package]
name = "libdoo_db"
version = "0.1.0"
edition = "2021"

[lib]
name = "doo_db"
crate-type = ["cdylib"]

[dependencies]
tokio = { version = "1.48", features = ["full"] }
tokio-postgres = "0.7"
once_cell = "1.19"
serde_json = "1.0"
dotenvy = "0.15"
libdoo_runtime = { path = "../libdoo_runtime" }
