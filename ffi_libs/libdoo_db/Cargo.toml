[package]
name = "libdoo_db"
version.workspace = true
edition.workspace = true

[lib]
name = "doo_db"
crate-type = ["cdylib"]

[dependencies]
tokio = { version = "1.48", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
chrono = "0.4"
once_cell = "1.21"
serde_json = "1.0"
dotenvy = "0.15"
doo_runtime = { package = "libdoo_runtime", path = "../libdoo_runtime" }
libc = "0.2"
native-tls = "0.2"
postgres-native-tls = "0.5"
