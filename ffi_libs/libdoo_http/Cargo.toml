[package]
name = "libdoo_http"
version.workspace = true
edition.workspace = true

[lib]
name = "doo_http"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
tokio = { version = "1.48", features = ["full"] }
hyper = { version = "1.8", features = ["full"] }
hyper-util = { version = "0.1.19", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
matchit = "0.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
regex = "1.12"
chrono = "0.4.42"
libdoo_runtime = { path = "../libdoo_runtime" }
libdoo_db = { path = "../libdoo_db" }
libdoo_auth = { path = "../libdoo_auth" }
