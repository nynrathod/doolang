[package]
name = "libdoo_auth"
version = "0.1.0"
edition = "2021"

[lib]
name = "doo_auth"
crate-type = ["cdylib"]

[dependencies]
once_cell = "1.19"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
bcrypt = "0.15"
libdoo_runtime = { path = "../libdoo_runtime" }
