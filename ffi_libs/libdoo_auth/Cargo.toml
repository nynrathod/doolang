[package]
name = "libdoo_auth"
version.workspace = true
edition.workspace = true

[lib]
name = "doo_auth"
crate-type = ["cdylib"]

[dependencies]
once_cell = "1.21"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
bcrypt = "0.17"
libdoo_runtime = { path = "../libdoo_runtime" }
