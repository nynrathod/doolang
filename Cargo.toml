[workspace]
members = [
	".",
	"crates/doo_core",
	"crates/doo_frontend",
	"crates/doo_hir",
	"crates/doo_analysis",
	"crates/doo_mir",
	"crates/doo_codegen",
	"crates/doo_driver",
	"crates/doo_diagnostics",
	"crates/doo_lsp",
	"crates/doo_migrate",
	"crates/doo_macro",
	"ffi/doo_ffi_core",
	"ffi/doo_ffi_json",
	"ffi/doo_ffi_http",
	"ffi/doo_ffi_db",
	"ffi/doo_ffi_auth",
	"ffi/doo_ffi_file",
	"ffi/doo_ffi_runtime",
	"ffi/doo_ffi_process",
	"ffi/doo_ffi_git",
]
resolver = "2"

[profile.dev]
incremental = true

[profile.release]
opt-level = 3     # Optimize for speed and performance
lto = true        # Link-time optimization
codegen-units = 1 # Better optimization
strip = true      # Strip symbols
panic = "abort"   # Smaller panic handler

[workspace.package]
version = "0.5.0"
edition = "2021"
authors = ["Nayan Rathod "]
repository = "https://github.com/nynrathod/doolang"

[package]
license = "MIT OR Apache-2.0"
name = "doo"
version.workspace = true
edition.workspace = true
default-run = "doo"

[dependencies]
# New compiler driver (Phase 10)
doo_driver = { path = "crates/doo_driver" }
doo_migrate = { path = "crates/doo_migrate" }

# Core types and debug infrastructure
doo_core = { path = "crates/doo_core" }

# Legacy dependencies (will be phased out)
inkwell = { version = "0.9.0", features = ["llvm22-1"] }
llvm-sys = "221"
clap = { version = "4.5.53", features = ["derive"] }
regex = "1"
bumpalo = "3.19.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
dialoguer = "0.12"
console = "0.16"
ctrlc = "3.5"
ureq = { version = "3.1", features = ["json"] }


[[bin]]
name = "doo"
path = "src/main.rs"

[dev-dependencies]
doo_frontend = { path = "crates/doo_frontend" }
doo_hir = { path = "crates/doo_hir" }
doo_analysis = { path = "crates/doo_analysis" }
doo_mir = { path = "crates/doo_mir" }
doo_codegen = { path = "crates/doo_codegen" }
doo_driver = { path = "crates/doo_driver" }
