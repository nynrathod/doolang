[workspace]
members = [
    ".",
    "ffi_libs/libdoo_file",
    "ffi_libs/libdoo_http",
    "ffi_libs/libdoo_db",
    "ffi_libs/libdoo_auth",
    "ffi_libs/libdoo_runtime",
]
resolver = "2"

[profile.dev]
incremental = true

[profile.release]
opt-level = 3        # Optimize for speed and performance
lto = true             # Link-time optimization
codegen-units = 1      # Better optimization
strip = true           # Strip symbols
panic = "abort"        # Smaller panic handler

[package]
name = "doo"
version = "0.2.0"
edition = "2021"
default-run = "doo"

[dependencies]
inkwell = { version = "0.6.0", features = ["llvm18-1"] }
llvm-sys = "=181.2.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1"
bumpalo = "3.19.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
dialoguer = "0.12"
console = "0.15"

[lib]
name = "doo"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "doo"
path = "src/main.rs"
