[workspace]
members = [
    ".",
    "crates/doo_core",
    "crates/doo_frontend",
    "crates/doo_hir",
    "crates/doo_analysis",
    "crates/doo_mir",
    "crates/doo_codegen",
    "crates/doo_driver",
    "crates/doo_diagnostics",
    "ffi/doo_ffi_core",
    "ffi/doo_ffi_http",
    "ffi/doo_ffi_db",
    "ffi/doo_ffi_auth",
    "ffi/doo_ffi_file",
    "ffi/doo_ffi_json",
    "ffi_libs/libdoo_file",
    "ffi_libs/libdoo_http",
    "ffi_libs/libdoo_db",
    "ffi_libs/libdoo_auth",
    "ffi_libs/libdoo_runtime",
]
resolver = "2"

[profile.dev]
incremental = true

[profile.release]
opt-level = 3        # Optimize for speed and performance
lto = true             # Link-time optimization
codegen-units = 1      # Better optimization
strip = true           # Strip symbols
panic = "abort"        # Smaller panic handler

[workspace.package]
version = "0.3.1"
edition = "2021"

[package]
name = "doo"
version.workspace = true
edition.workspace = true
default-run = "doo"

[dependencies]
inkwell = { version = "0.6.0", features = ["llvm18-1"] }
llvm-sys = "=181.2.0"
clap = { version = "4.5.53", features = ["derive"] }
regex = "1"
bumpalo = "3.19.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
dialoguer = "0.12"
console = "0.16"
ctrlc = "3.5"
ureq = { version = "3.1", features = ["json"] }


[lib]
name = "doo"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "doo"
path = "src/main.rs"
